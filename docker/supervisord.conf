[supervisord]
nodaemon=true
user=root
logfile=/logs/supervisor/supervisor.log
logfile_maxbytes=10MB
logfile_backups=10
childlogdir=/logs/supervisor
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:apache]
command=/usr/sbin/apache2ctl -D FOREGROUND
autorestart=true
startretries=999999
startsecs=5
user=root
priority=100
environment=APACHE_LOG_DIR= /logs/apache2
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/logs/supervisor/apache.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=10

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
startretries=3
startsecs=5
user=root
priority=50
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/logs/supervisor/cron.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=10

